                // on this device (Cache Storage) and are not downloaded again: after the first visit only
                // what changed comes down. Parts of older versions are thrown away once the game is up.
                const SHELF = 'game-parts:' + location.pathname.replace(/[^/]*$/, '');
                let shelf = null;
                const shelfReady = (async () => {
                    try {
                        shelf = await caches.open(SHELF);
                        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
                    } catch (e) {
                        shelf = null; // (no storage here: everything is simply downloaded each time)
                    }
                })();

                /** The bytes of data/<file>: from this device if they are here, else downloaded (and kept). */
                async function getBytes(file, size, onChunk) {
                    await shelfReady;
                    const url = 'data/' + file;
                    if (shelf) {
                        try {
                            const hit = await shelf.match(url);
                            if (hit) {
                                const kept = new Uint8Array(await hit.arrayBuffer());
                                if (!size || kept.length === size) {
                                    if (onChunk) onChunk(kept.length, true);
                                    return kept;
                                }
                                await shelf.delete(url); // (cut short once: fetch it again)
                            }
                        } catch (e) {}
                    }
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) throw new Error('fetch ' + file);
                    let buf;
                    if (res.body && res.body.getReader) {
                        const reader = res.body.getReader();
                        const got = [];
                        let n = 0;
                        for (;;) {
                            const step = await reader.read();
                            if (step.done) break;
                            got.push(step.value);
                            n += step.value.length;
                            if (onChunk) onChunk(step.value.length, false);
                        }
                        buf = new Uint8Array(n);
                        let at = 0;
                        for (const part of got) {
                            buf.set(part, at);
                            at += part.length;
                        }
                    } else {
                        buf = new Uint8Array(await res.arrayBuffer());
                        if (onChunk) onChunk(buf.length, false);
                    }
                    if (size && buf.length !== size) throw new Error('fetch ' + file + ': ' + buf.length + ' of ' + size);
                    if (shelf) {
                        try {
                            await shelf.put(url, new Response(buf, { headers: { 'Content-Type': 'application/octet-stream' } }));
                        } catch (e) {
                            // (no room: it will be downloaded again next time)
                        }
                    }
                    return buf;
                }

                const open = (key, buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));

                /** Parts of versions that are no longer the game's: off this device. */
                async function tidyShelf() {
                    if (!shelf) return;
                    const mine = new Set([...(META.parts || []).map((q) => q.f), ...META.tracks.map((t) => t.file)]);
                    try {
                        for (const req of await shelf.keys()) {
                            const name = req.url.split('/').pop();
                            if (!mine.has(name)) await shelf.delete(req);
                        }
                    } catch (e) {}
                }

                async function fetchDecrypt(key, file) {
                    return open(key, await getBytes(file, 0));
                }

                // A wrong key shows up as a failed decrypt; anything else (no network,
                // a download cut short, the phone short of memory) is not the password's fault.
                const wrongKey = (err) => !!err && err.name === 'OperationError';

                async function launch(key, onUnlocked) {
                    // Throws on a wrong key (GCM tag mismatch).
                    const parts = META.parts;
                    const sizeOf = Object.fromEntries(parts.map((q) => [q.f, q.n]));
                    const first = parts.filter((q) => q.k !== 'lazy');
                    const total = first.reduce((sum, q) => sum + q.n, 0);
                    let done = 0;
                    let fresh = 0; // (bytes that really came down the line this time)
                    const tick = (n, kept) => {
                        done += n;
                        if (!kept) fresh += n;
                        progress(done, total, fresh);
                    };
                    progress(0, total, 0);
                    const text = async (f, note) => new TextDecoder().decode(await open(key, await getBytes(f, sizeOf[f], note)));
                    // (the script first: it is small, and a wrong password shows at once)
                    const app = JSON.parse(await text(parts.find((q) => q.k === 'core').f, tick));
                    if (onUnlocked) onUnlocked();
                    app.art = {};
                    const sfx = {};
                    for (const q of first) {
                        if (q.k === 'core') continue;
                        const obj = JSON.parse(await text(q.f, tick));
                        if (q.k === 'art') Object.assign(app.art, obj);
                        else if (q.k === 'sfx') {
                            // (one object of files for each folder of a set, in the folders' order)
                            const list = (sfx[q.s] = sfx[q.s] || []);
                            list[q.i] = Object.assign(list[q.i] || {}, obj);
                        }
                    }
                    for (const set in sfx) sfx[set] = sfx[set].filter(Boolean);
                    if (Object.keys(sfx).length) window.__SFX_FILES = sfx;

                    // The parts that belong to one hero come when that hero is wanted (app.lazy says
                    // which). The game asks through these two; each part is fetched once (and is on the
                    // device from then on).
                    const lazy = app.lazy || { art: {}, sfx: {} };
                    const waitLabel = (what) => {
                        const el = document.getElementById('loading');
                        if (el) el.textContent = what;
                    };
                    const artJobs = {};
                    window.__ART_NEED = (artKey) => {
                        if (app.art[artKey]) return null;
                        // (a foe's, a boss's, a map's picture the start screens do not draw: in a part of its own, named in lazy.group —
                        //  build-protected.mjs art-start)
                        const group = lazy.group && lazy.group[artKey];
                        if (group) return fetchPart(group, '그림 받는 중…');
                        if (artKey.indexOf('heroes/') !== 0) return null;
                        const name = artKey.slice(7);
                        let hero = name.split('_')[0];
                        // (a still or a face: those came at the start, and if one is not there it was never drawn)
                        if (name === hero || (lazy.faces || []).indexOf(name.slice(hero.length + 1)) >= 0) return null;
                        // (a hero's effect strips are a small part of their own: '<hero>~fx')
                        if (/_(fx|gx|hx|ix)$/.test(name) && lazy.art[hero + '~fx']) hero = hero + '~fx';
                        if (!lazy.art[hero]) return null;
                        return fetchPart(hero, '캐릭터 받는 중…');
                    };
                    // (one part of pictures, fetched once; a failed one is asked for again next time)
                    const fetchPart = (hero, word) => {
                        return (artJobs[hero] =
                            artJobs[hero] ||
                            (async () => {
                                try {
                                    let got = 0;
                                    const all = lazy.art[hero].reduce((sum, f) => sum + sizeOf[f], 0);
                                    for (const f of lazy.art[hero]) {
                                        Object.assign(app.art, JSON.parse(await text(f, (n, kept) => {
                                            got += n;
                                            if (!kept) waitLabel(`${word} ${Math.round((got / all) * 100)}%`);
                                        })));
                                    }
                                } catch (e) {
                                    artJobs[hero] = null; // (no network just now: asked again next time)
                                    if (window.__diagNote) window.__diagNote('그림을 못 받았어요: ' + hero + ' / ' + (e && e.message ? e.message : e));
                                }
                            })());
                    };
                    const sfxJobs = {};
                    window.__SFX_NEED = (hero) =>
                        (sfxJobs[hero] =
                            sfxJobs[hero] ||
                            (async () => {
                                const out = {};
                                try {
                                    for (const q of lazy.sfx[hero] || []) {
                                        const list = (out[q.s] = out[q.s] || []);
                                        list[q.i] = Object.assign(list[q.i] || {}, JSON.parse(await text(q.f)));
                                    }
                                } catch (e) {
                                    sfxJobs[hero] = null;
                                    if (window.__diagNote) window.__diagNote('캐릭터 소리를 못 받았어요: ' + hero + ' / ' + (e && e.message ? e.message : e));
                                }
                                for (const set in out) out[set] = out[set].filter(Boolean);
                                return out;
                            })());
                    tidyShelf();
                    // BGM: each track decrypts lazily the first time it is needed.
                    const loaders = META.tracks.map((t) => {
                        let p = null;
                        const load = () =>
                            (p =
                                p ||
                                fetchDecrypt(key, t.file).then((buf) =>
                                    URL.createObjectURL(new Blob([buf], { type: t.type }))
                                ));
                        return { group: t.group || 'rest', load };
                    });
                    window.__BGM_TRACKS = Promise.resolve({
                        first: loaders.filter((l) => l.group === 'first').map((l) => l.load),
                        rest: loaders.filter((l) => l.group !== 'first' && l.group !== 'later' && l.group !== 'siren').map((l) => l.load),
                        siren: (loaders.find((l) => l.group === 'siren') || {}).load || null,
                        later: loaders.filter((l) => l.group === 'later').map((l) => l.load),
                        maxSeconds: META.maxSeconds || 0
                    });
                    window.__ART_IMAGES = app.art || {};
                    document.getElementById('gateStyle').remove();
                    const style = document.createElement('style');
                    style.textContent = app.css;
                    document.head.appendChild(style);
                    document.title = META.title || 'Game';
                    document.body.innerHTML = app.body;
                    // Diagnostics: if the game stops (a white page), the reason is written on the screen
                    // (no more guessing from a phone): errors, a lost graphics context, or "still loading".
                    const lines = [];
                    let box = null;
                    const note = (what) => {
                        lines.push(what);
                        if (lines.length > 8) lines.shift();
                        if (!box || !box.isConnected) {
                            box = document.createElement('pre');
                            box.id = 'gateDiag';
                            box.style.cssText =
                                'position:fixed;left:0;right:0;top:0;z-index:2147483647;margin:0;padding:10px;max-height:60%;overflow:auto;' +
                                'background:rgba(0,0,0,.88);color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-all;user-select:text';
                            document.body.appendChild(box);
                        }
                        box.textContent = '[진단] 버전 ' + (META.ver || '?') + '\n' + lines.join('\n');
                    };
                    window.__diagNote = note;
                    // (a small version mark in the corner: two phones, or a phone and the builder, can be told apart)
                    const tag = document.createElement('div');
                    tag.textContent = 'v' + (META.ver || '?');
                    tag.style.cssText = 'position:fixed;left:4px;bottom:2px;z-index:2147483646;font:10px monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:4px;pointer-events:none';
                    document.body.appendChild(tag);
                    window.addEventListener('error', (e) => {
                        if (e.target && e.target !== window && e.target.tagName) return; // (a picture that did not load: not a stop)
                        note('오류: ' + e.message + (e.lineno ? ' (' + e.lineno + ':' + e.colno + ')' : '') + (e.error && e.error.stack ? '\n' + String(e.error.stack).slice(0, 400) : ''));
                    });
                    window.addEventListener('unhandledrejection', (e) => {
                        const r = e.reason;
                        note('약속 오류: ' + (r && r.message ? r.message : String(r)) + (r && r.stack ? '\n' + String(r.stack).slice(0, 400) : ''));
                    });
                    document.addEventListener('webglcontextlost', () => note('그래픽이 끊겼어요 (webglcontextlost)'), true);
                    const t0 = Date.now();
                    const dog = setInterval(() => {
                        const waiting = document.getElementById('loading');
                        if (!waiting) return clearInterval(dog); // (the game is up)
                        if (Date.now() - t0 > 20000) note('아직 "' + waiting.textContent + '" 입니다 (' + Math.round((Date.now() - t0) / 1000) + '초)');
                    }, 5000);
                    const s = document.createElement('script');
                    s.src = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
                    s.onerror = () => note('게임 프로그램을 열지 못했어요 (script)');
                    document.body.appendChild(s);
                }

                async function tryStored() {
                    let raw = null;
                    try {
                        raw = localStorage.getItem(STORE);
                    } catch (e) {}
                    if (!raw) return false;
                    // remembered: no need to type anything, just wait for the download
                    const form = document.getElementById('gateForm');
                    const wait = document.createElement('h1');
                    wait.textContent = '⏳ 게임을 불러오는 중이에요';
                    const hide = [].filter.call(form.children, (el) => el !== bar && el !== pct);
                    hide.forEach((el) => (el.style.display = 'none'));
                    form.insertBefore(wait, form.firstChild);
                    const show = () => hide.forEach((el) => (el.style.display = ''));
                    try {
                        const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
                        await launch(key);
                        return true;
                    } catch (e) {
                        wait.remove();
                        bar.style.display = 'none';
                        pct.textContent = '';
                        show();
                        if (wrongKey(e)) {
                            // the password was changed since: forget the old one
                            try {
                                localStorage.removeItem(STORE);
                            } catch (e2) {}
                        } else {
                            // keep the remembered password; this was a loading problem
                            hide.forEach((el) => (el.style.display = 'none'));
                            const retry = document.createElement('h1');
                            retry.innerHTML = '😢 불러오지 못했어요.<br><button type="button" style="margin-top:14px;padding:12px 22px;font-size:16px;border-radius:12px">다시 시도</button>';
                            retry.querySelector('button').onclick = () => location.reload();
                            form.insertBefore(retry, form.firstChild);
                        }
                        return false;
                    }
                }

                document.getElementById('gateForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const pw = document.getElementById('gatePw').value;
                    const remember = document.getElementById('gateRemember').checked;
                    if (!pw) return;
                    btn.disabled = true;
                    msg.textContent = '여는 중... (처음에는 조금 걸려요)';
                    try {
                        const key = await derive(pw, remember);
                        // (remembered as soon as the password is known to be right, before the game starts)
                        const raw = remember ? toB64(new Uint8Array(await crypto.subtle.exportKey('raw', key))) : null;
                        await launch(key, () => {
                            msg.textContent = '맞아요! 게임을 불러오는 중…';
                            if (!raw) return;
                            try {
                                localStorage.setItem(STORE, raw);
                            } catch (e2) {}
                        });
                    } catch (err) {
                        bar.style.display = 'none';
                        pct.textContent = '';
                        msg.textContent = wrongKey(err) ? '비밀번호가 틀렸어요.' : '불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
                        btn.disabled = false;
                    }
                });

                if (!window.crypto || !crypto.subtle) {
                    msg.textContent = 'https 주소로 접속해 주세요.';
                    btn.disabled = true;
                } else {
                    tryStored();
                }
            })();
        </script>
    </body>
</html>
